[workspace]
members = [".", "guido-macros"]

[workspace.package]
version = "0.5.0"
edition = "2024"
authors = ["Simone Camito"]
categories = ["gui", "reactive", "wayland", "leyershell", "wgpu"]
keywords = ["gui", "reactive", "wayland", "leyershell", "wgpu", "guido"]
readme = "README.md"
documentation = "https://docs.rs/guido"
repository = "https://github.com/MalpenZibo/guido"
homepage = "https://malpenzibo.github.io/guido"
license = "MIT"

[workspace.dependencies]
guido-macros = { path = "guido-macros", version = "0.5.0" }

[package]
name = "guido"
description = "A reactive Rust GUI library using wgpu for Wayland layer shell widgets"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
license.workspace = true

[features]
default = ["svg", "webp"]
render-stats = []
# The apparatus #264 needs to drive a frame with no compositor: an offscreen
# render target and the readback that makes one worth drawing into. On by
# nothing, so a normal build ships no render-to-texture API it did not ask for;
# in-crate tests get it from `cfg(test)` without the feature at all.
testing = []
# SVG rendering via resvg (pulls a second text-shaping stack + software
# rasterizer). Without it, ImageSource::Svg* sources fail to decode with a
# warning instead of failing to compile.
svg = ["dep:resvg"]
# Additional raster decoders beyond the png/jpeg defaults
webp = ["image/webp"]
gif = ["image/gif"]

[dependencies]
guido-macros = { workspace = true }
wgpu = { version = "28.0", features = ["fragile-send-sync-non-atomic-wasm"] }
bytemuck = { version = "1.24", features = ["derive"] }
glyphon = "0.10"
cosmic-text = "0.17"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
# Staging protocols not wrapped by sctk (ext-background-effect-v1 for blur)
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.46", optional = true }
pollster = "0.4"
log = "0.4"
bitflags = "2.4"
libc = "0.2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
smallvec = "1"
rustc-hash = "2"

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The golden-image tests own their render target, so they speak to wgpu
# directly. Same version and features as the dependency above, so the test
# and the library share one wgpu and its types line up.
wgpu = { version = "28.0", features = ["fragile-send-sync-non-atomic-wasm"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "status_bar"
path = "examples/status_bar.rs"

[[example]]
name = "reactive_example"
path = "examples/reactive_example.rs"

[[example]]
name = "showcase"
path = "examples/showcase.rs"

[[example]]
name = "image_example"
path = "examples/image_example.rs"

[[example]]
name = "text_input_example"
path = "examples/text_input_example.rs"

[[example]]
name = "render_stats_test"
path = "examples/render_stats_test.rs"

[[example]]
name = "renderer_v2_test"
path = "examples/renderer_v2_test.rs"

[[example]]
name = "perf_stress_test"
path = "examples/perf_stress_test.rs"

# Pixel-crunching dependencies are unusable at opt-level 0 (an SVG raster
# costs ~25ms at 16px, text shaping multiplies similarly): optimize them
# even in dev builds so examples and downstream dev runs behave. Guido's
# own code stays unoptimized for fast rebuilds.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.rustybuzz]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.fontdb]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.image]
opt-level = 3

name: CI

on:
  push:
    branches:
      - main
  # Every pull request, whatever it is aimed at. Filtering on `main` left a
  # pull request stacked on another branch with no checks at all — the two
  # workflows that do not filter, Labeler and Release Drafter, were the only
  # thing that ran on it, which looks like a green tick from a distance.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Build
        run: cargo build --all-features

  golden:
    name: Golden images
    runs-on: ubuntu-latest
    # lavapipe is Mesa's software Vulkan implementation. It is the rasterizer
    # the goldens were blessed against, because a hosted runner has no GPU and
    # because a golden is only reproducible against one rasterizer anyway.
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      # Without an adapter the tests skip themselves, which would report green
      # here for the one reason that matters. In CI a skip is a failure.
      GUIDO_GOLDEN_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers vulkan-tools
      - name: Report the rasterizer
        run: vulkaninfo --summary | head -n 40
      - name: Run golden image tests
        run: cargo test --all-features --test golden_images
      - name: Upload the pixels that moved
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: target/golden-failures/
          if-no-files-found: ignore

  golden-guard:
    name: Golden re-bless needs a label
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Re-blessing a golden is the one edit that makes a failing pixel test
      # pass without changing a pixel back. It stays possible, but it stops
      # being something that can happen quietly.
      #
      # Only a rewrite or a deletion, never an addition: a new scenario brings
      # a new golden with it, and that is ordinary work. Asking for the label
      # there too would put it on most pull requests, and a label everybody
      # applies is a label nobody reads.
      - name: Refuse an unlabelled re-bless
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=MD "$BASE" "$HEAD" -- tests/golden/)
          if [ -z "$changed" ]; then
            echo "No goldens touched."
            exit 0
          fi
          echo "Goldens changed by this pull request:"
          echo "$changed"
          if echo "$LABELS" | grep -q '"golden-update"'; then
            echo "Carries the golden-update label — the change is somebody's decision."
            exit 0
          fi
          echo "::error::This pull request edits tests/golden/ without the \
          golden-update label. A changed golden is a changed pixel on \
          someone's screen: look at the diff, and add the label to say you did."
          exit 1

name: CI

on:
  push:
    branches:
      - main
  # Every pull request, whatever it is aimed at. Filtering on `main` left a
  # pull request stacked on another branch with no checks at all — the two
  # workflows that do not filter, Labeler and Release Drafter, were the only
  # thing that ran on it, which looks like a green tick from a distance.
  pull_request:

# A new push supersedes the run already in flight for the same branch. Pull
# request runs are cancelled; runs on main are not, because those are the record
# of what was merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints and the documentation build, which share a toolchain and
  # a cache and cost nothing extra together. There is no separate build job:
  # `clippy --all-targets --all-features` type-checks the library, the tests,
  # the examples and the benches, and `cargo test` links what it runs.
  check:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # The guard that refuses a re-bless and a commit on main decides by the
      # position a word occupies, not by whether it appears. Getting that wrong
      # is how it came to refuse a sed expression and to read the branch of the
      # wrong repository. The table says what it has to get right.
      - name: Check the commit guard
        run: .claude/hooks/guard-bash.test.sh

      # A broken intra-doc link is a broken promise in the published API
      # reference, and it costs one compile to find.
      - name: Build the API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Run tests
        run: cargo test --all-features

  golden:
    name: Golden images
    runs-on: ubuntu-latest
    env:
      # Without an adapter the golden tests skip themselves, which would report
      # green here for the one reason that matters. In CI a skip is a failure.
      GUIDO_GOLDEN_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers vulkan-tools
      # lavapipe is Mesa's software Vulkan implementation, and it is the
      # rasterizer the goldens were blessed against: a hosted runner has no GPU,
      # and a golden is only reproducible against one rasterizer anyway. The
      # file is named differently across distributions, so it is found, not
      # assumed.
      - name: Point the Vulkan loader at lavapipe
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1)
          if [ -z "$icd" ]; then
            icd=$(dpkg -L mesa-vulkan-drivers 2>/dev/null \
              | grep -E 'icd\.d/.*\.json$' | grep -i lvp | head -n 1)
          fi
          if [ -z "$icd" ]; then
            echo "::error::No lavapipe ICD found. What is installed:"
            dpkg -L mesa-vulkan-drivers 2>/dev/null | grep -E '\.json$' || true
            ls -la /usr/share/vulkan/icd.d/ 2>/dev/null || true
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "Using $icd"
      - name: Report the rasterizer
        run: vulkaninfo --summary | head -n 40
      - name: Run golden image tests
        run: cargo test --all-features --test golden_images
      - name: Upload the pixels that moved
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: target/golden-failures/
          if-no-files-found: ignore

  book:
    name: Book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      # The book is deployed from main. Building it here means a chapter that
      # stopped compiling is found in the pull request that broke it, rather
      # than in the deploy that follows the merge.
      - name: Build the book
        run: mdbook build book

  golden-guard:
    name: Golden re-bless needs a label
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Re-blessing a golden is the one edit that makes a failing pixel test
      # pass without changing a pixel back. It stays possible, and it stops
      # being able to happen quietly.
      #
      # Only a rewrite or a deletion, never an addition: a new scenario brings
      # a new reference with it, and that is ordinary work. Asking for the
      # label there too would put it on most pull requests, and a label
      # everybody applies is a label nobody reads.
      - name: Refuse an unlabelled re-bless
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=MD "$BASE" "$HEAD" -- tests/golden/ tests/snapshots/)
          if [ -z "$changed" ]; then
            echo "No reference artifacts touched."
            exit 0
          fi
          echo "Reference artifacts changed by this pull request:"
          echo "$changed"
          if echo "$LABELS" | grep -q '"golden-update"'; then
            echo "Carries the golden-update label — somebody decided this."
            exit 0
          fi
          echo "::error::This pull request rewrites reference artifacts without \
          the golden-update label. A changed golden is a changed pixel on \
          someone's screen: look at the diff, then add the label to say you did."
          exit 1
